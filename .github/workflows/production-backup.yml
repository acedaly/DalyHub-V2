name: Production D1 backup

# AUDIT-11 / SET-02 — the automated, ENCRYPTED production disaster-recovery copy.
#
# What changed, and why it mattered. This workflow used to upload the complete
# production database as a plain `dalyhub-v2-production-*.sql` artifact with
# 30-day retention. The Cloudflare credentials were handled correctly and that
# was never the finding: the DUMP is the owner's entire personal life — People
# and their contact details, Diary entries, Meeting notes, Reviews, archived and
# deleted records — and anyone who could read this repository's Actions could
# read all of it, in plain text, for a month. Encryption is now applied on the
# runner, before upload, and the plaintext never becomes an artifact.
#
# WHICH BACKUP IS WHICH (both are real, and they are not interchangeable):
#
#   * This artifact is the INFRASTRUCTURE disaster-recovery copy: a raw
#     Cloudflare D1 SQL dump. It rebuilds the DATABASE when the database itself
#     is gone. It is not what DalyHub's Restore reads, and no SQL from here is
#     ever executed through the application.
#   * The CANONICAL DalyHub backup is the owner-initiated archive from
#     Settings → Privacy & data → "Download full DalyHub export". That is the
#     versioned `DalyHubWorkspaceSnapshotV1` archive SET-02 validates and
#     restores, and it is the one to reach for in ordinary recovery.
#
# Why the canonical backup is not produced here: building it requires the
# application runtime AND an authenticated owner session, and DalyHub
# deliberately has no unauthenticated export path. Inventing one so a scheduled
# job could call it would open a larger hole than this workflow closes. The
# recovery order is therefore: restore this dump into D1, bring the application
# back, then take a canonical backup from Settings. That sequence is documented
# in docs/development/BACKUP_AND_RESTORE.md.
#
# Security posture:
#   - The export runs through the SAME audited wrapper the owner uses by hand
#     (`scripts/production-d1.mjs`), and encryption/validation/verification run
#     through the SAME `scripts/production-backup.mjs` a manual run uses. There
#     is one pipeline: `workflow_dispatch` and `schedule` take identical steps.
#   - The encryption passphrase comes from the protected `production` GitHub
#     environment, is written to a file under `umask 077`, is never passed on a
#     command line or interpolated into a shell string, and is deleted in a step
#     that always runs. Shell tracing is never enabled, because a trace echoes
#     every expanded command and would put the secret in the log.
#   - Nothing prints backup contents. Every log line is a file name, a byte
#     count or a digest.
#   - Only `schedule` and `workflow_dispatch` trigger this job, so no pull
#     request — from a fork or otherwise — can run it or reach its secrets.
#   - Workflow permissions are read-only; artifact upload needs nothing more.
#
# Recovery key: see docs/development/BACKUP_AND_RESTORE.md § "The recovery key".
# The owner holds a copy OFF GitHub. Without it these artifacts are unreadable —
# by anyone, including the owner. That is the point, and it is the reason the
# off-GitHub copy is a documented operational obligation rather than a nicety.

on:
  schedule:
    # Daily at 16:30 UTC — 02:30 in the owner's timezone (Australia/Sydney,
    # AEST), a quiet hour for the workspace so the export is coherent.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  export:
    name: Export, encrypt and prove recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `production` GitHub environment holds the Cloudflare secrets, the
    # backup encryption passphrase, and any protection rules the owner
    # configures for it.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        # The SHARED composite action, the same one every CI job uses. This job
        # hand-rolled corepack + setup-node + install for its whole life, which
        # is exactly the copy-paste the action's own description says it exists
        # to end: the backup job could quietly end up on a different Node or a
        # different pnpm from the one the pipeline it runs is tested against.
        uses: ./.github/actions/setup

      - name: Refuse to run without an encryption key
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          # Fail BEFORE the database is read. A run that exports production and
          # then discovers it cannot encrypt has already created the plaintext
          # this workflow exists to avoid.
          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE is not set in the production environment. Refusing to export production data that cannot be encrypted."
            exit 1
          fi
          # A key made of whitespace is not a key, and `-z` accepts one. GnuPG
          # would encrypt with it perfectly happily, producing an artifact that
          # looks exactly like a real backup and is protected by nothing.
          trimmed_length="$(printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" | tr -d '[:space:]' | wc -c)"
          if [ "${trimmed_length}" -lt 32 ]; then
            # The LENGTH is compared, never printed, and the message names the
            # requirement rather than what was found. 32 is the floor because
            # this passphrase is the only thing between a stolen artifact and
            # the owner's entire life, and the generation command in
            # docs/development/BACKUP_AND_RESTORE.md § "The recovery key"
            # produces 64 characters.
            echo "::error::BACKUP_ENCRYPTION_PASSPHRASE must be at least 32 non-whitespace characters. Refusing to encrypt the owner's entire database under a weak key."
            exit 1
          fi
          echo "Encryption key is present and long enough. Its value is never printed."

      - name: Export, validate, encrypt and verify
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          # The plaintext is written to a scratch directory that is NEVER the
          # upload path. `backup/` holds only what may be published.
          scratch="$(mktemp -d)"
          plain="${scratch}/dalyhub-v2-production-${stamp}.sql"
          key="${scratch}/backup.key"
          receipt="${scratch}/recovery-receipt.json"
          mkdir -p backup
          encrypted="backup/dalyhub-v2-production-${stamp}.sql.gpg"

          # The passphrase reaches disk only, with owner-only permissions, and
          # only inside the scratch directory that is removed below. It is never
          # an argv value (world-readable via /proc) and never interpolated into
          # a command string (echoable by a trace).
          ( umask 077 && printf '%s' "${BACKUP_ENCRYPTION_PASSPHRASE}" > "${key}" )

          cleanup() {
            # Always: even on failure, the plaintext dump and the key file must
            # not survive this step for a later step (or a debug re-run) to find.
            rm -rf "${scratch}"
          }
          # INT and TERM as well as EXIT. A cancelled workflow — the job's
          # `timeout-minutes`, or a person pressing Cancel — signals the step
          # rather than letting it exit, and a bare `trap … EXIT` does not run
          # then. That is the one case where the owner's whole database is
          # sitting in plaintext on a runner nobody is watching.
          trap cleanup EXIT INT TERM

          echo "Exporting the production database…"
          pnpm run db:production:export -- --output "${plain}"

          echo "Validating the dump structurally…"
          node scripts/production-backup.mjs validate --in "${plain}"

          echo "Encrypting…"
          node scripts/production-backup.mjs encrypt \
            --in "${plain}" --out "${encrypted}" --passphrase-file "${key}"

          echo "Proving the encrypted artifact decrypts back to the dump…"
          node scripts/production-backup.mjs verify \
            --in "${plain}" --encrypted "${encrypted}" --passphrase-file "${key}" \
            --receipt "${receipt}"

          # And proving the payload is a DATABASE, not merely a decryptable file.
          # `verify` above answers "do the bytes come back?"; this answers "do
          # the bytes load?" — it starts from the encrypted artifact and the key,
          # exactly as a real recovery does, executes the dump into a throwaway
          # SQLite file inside the scratch directory, and reads the kernel tables
          # back out. A schema-only or half-written export passes every check
          # above it and fails here.
          echo "Rehearsing the restore from the encrypted artifact…"
          node scripts/production-backup.mjs rehearse \
            --encrypted "${encrypted}" --passphrase-file "${key}" \
            --receipt "${receipt}"

          # The receipt is what makes the metadata's `recoveryVerified` claim
          # evidence rather than a constant. It lives in the SCRATCH directory,
          # never in `backup/`: it is not part of the artifact.
          node scripts/production-backup.mjs metadata \
            --encrypted "${encrypted}" --receipt "${receipt}" \
            --out backup/metadata.json \
            --field "environment=production" \
            --field "database=dalyhub-v2 (production)" \
            --field "exportedAtUtc=${stamp}" \
            --field "workflowRunId=${GITHUB_RUN_ID}" \
            --field "workflowRunUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --field "repositoryCommit=${GITHUB_SHA}" \
            --field "retentionDays=30"

          echo "artifact_name=dalyhub-v2-production-d1-${stamp}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Refuse to upload anything unencrypted
        run: |
          set -euo pipefail
          # The last line of defence, and the one that would catch a future edit
          # that reintroduced the finding. It inspects the upload directory only,
          # by NAME — it never reads or prints file contents.
          #
          # An ALLOW-LIST, not a deny-list, and that is the whole point of this
          # step. The previous rule refused `*.sql`, `*.json` and `*.zip`, so a
          # plaintext dump written as `dump.txt`, `dump.bak` or with no extension
          # at all walked straight past it and into a thirty-day artifact. The
          # question worth asking is not "does this look dangerous?" but "is this
          # one of the two files this artifact is allowed to contain?" — which is
          # the same allow-list-not-deny-list rule the restore reader already
          # applies to an incoming archive.
          unexpected="$(find backup -type f \
            ! -name '*.sql.gpg' ! -name 'metadata.json' -print)"
          if [ -n "${unexpected}" ]; then
            echo "::error::Refusing to upload: the artifact directory contains a file that is neither an encrypted backup nor its metadata."
            echo "${unexpected}"
            exit 1
          fi
          # Directories cannot carry a plaintext dump past the rule above by
          # hiding it one level down — `find -type f` is recursive — but an empty
          # directory tree in the artifact would still be noise nobody intended.
          if [ -n "$(find backup -mindepth 1 -type d -print)" ]; then
            echo "::error::Refusing to upload: the artifact directory has subdirectories, which this pipeline never creates."
            exit 1
          fi
          if [ ! -s backup/metadata.json ]; then
            echo "::error::The backup metadata is missing."
            exit 1
          fi
          if ! ls backup/*.gpg >/dev/null 2>&1; then
            echo "::error::No encrypted backup was produced."
            exit 1
          fi
          # A key must never travel with the data it protects.
          if grep -qiE '"(passphrase|password|secret|key|token|credential)[^"]*"[[:space:]]*:' backup/metadata.json; then
            echo "::error::The backup metadata names a credential field."
            exit 1
          fi
          echo "Upload contents verified: encrypted backup plus non-sensitive metadata only."

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: backup/
          # Retention stays at 30 days, deliberately unchanged by the move to
          # encryption. It was not reduced (encryption addressed the exposure, so
          # shortening the window would only weaken recovery for no security
          # gain) and it was not extended (encryption is not a reason to keep
          # more of the owner's data on GitHub for longer). Thirty dailies is a
          # month of recoverable history; anything the owner wants beyond that is
          # a downloaded copy they hold themselves — see
          # docs/development/BACKUP_AND_RESTORE.md § "Retention".
          retention-days: 30
          if-no-files-found: error
