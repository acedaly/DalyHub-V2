name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs, never superseded `main` runs.
#
# The previous `cancel-in-progress: true` was unconditional, so merging twice in
# quick succession cancelled the FIRST merge's verification of `main` — the one
# run whose result actually gates the branch. A cancelled job is also
# indistinguishable at a glance from a failed one, so this quietly manufactured
# red on `main`. PRs keep the behaviour that matters: push a new commit and the
# obsolete run stops consuming runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow only reads the repository. It holds no
# Cloudflare credentials and never deploys — ordinary validation must not be
# able to touch production. It also never contacts hub.daly.id.au: that origin
# is behind Cloudflare Access, so an unauthenticated probe returns an auth
# challenge rather than the application, and treating that as a source-code
# failure is exactly the false red this pipeline must not produce. Deployment
# verification is a separate, credentialled concern.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Tier gate. Decides whether the expensive jobs have anything to check.
  # ---------------------------------------------------------------------------
  changes:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the merge base to diff a PR against its target.
          fetch-depth: 0

      - name: Does this change touch anything executable?
        id: scope
        # Deliberately FAIL-OPEN, in both directions that matter:
        #
        #   - a push to `main` never consults the filter at all;
        #   - any error, any unknown state, an empty diff, a merge base that
        #     cannot be resolved — all fall through to `code=true`.
        #
        # So the only way to skip the heavy jobs is for the diff to resolve
        # cleanly AND for every changed path to be documentation or an image.
        # A rule that can only ever skip by proving the change is inert is the
        # kind of path filtering that is safe to read six months from now; a
        # rule that skips whenever it fails to understand something is not.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request — running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if ! files="$(git diff --name-only "$base" "$head" 2>/dev/null)" || [ -z "$files" ]; then
            echo "Could not resolve a non-empty diff — running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
          # Anything NOT matching the inert allowlist forces the full run.
          #
          # Decided on the CONTENT of the non-inert list, not on grep's exit
          # code, and computed with a here-string rather than a pipe. The first
          # version of this did `echo "$files" | grep -qvE …` under
          # `set -o pipefail`, which is a trap: `grep -q` exits at its FIRST
          # match, `echo` is then killed by SIGPIPE (141), and `pipefail`
          # reports 141 as the pipeline's status — so "there are executable
          # paths" was read as "there are none". It skipped Unit, Build and E2E
          # on a pull request that changed `playwright.config.ts`, four specs
          # and two stylesheets, which is the exact silent-skip this filter was
          # written to be incapable of.
          #
          # The rewrite cannot fail that way: no pipe, so no SIGPIPE; `|| true`
          # absorbs grep's ordinary exit-1-on-no-match; and the question asked
          # is "is the non-inert list non-empty", which has no third answer.
          executable="$(grep -vE '^(docs/.*|.*\.md|.*\.png|.*\.jpg|.*\.jpeg|.*\.webp)$' <<<"$files" || true)"
          if [ -n "$executable" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Executable paths changed — running everything:"
            printf '%s\n' "$executable" | sed 's/^/  /'
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation/imagery only — Static alone is sufficient."
          fi

  # ---------------------------------------------------------------------------
  # Tier 1 — every push and every pull request.
  # ---------------------------------------------------------------------------
  static:
    name: Static
    # Always runs, including for documentation-only changes: prettier formats
    # Markdown, so a docs PR still has something real to fail.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Formatting
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Generated colour scheme matches its source
        # `pnpm run verify` has always run this locally, but CI never did — so
        # a hand-edited scheme, or a source change committed without
        # regenerating, could reach `main` with the gate green. Same shape as
        # the icon check below, same reason.
        run: pnpm run scheme:check

      - name: Icon assets match the canonical geometry
        # The rasteriser and encoders are deterministic, so this regenerates in
        # memory and compares bytes: a hand-edited PNG, or a geometry change
        # committed without regenerating, fails here rather than shipping
        # artwork that no longer matches its source.
        run: pnpm run icons:check

  test:
    name: Unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Unit & component tests
        run: pnpm run test:unit

      - name: Kernel tests (Workers runtime + real D1)
        # The data-kernel suite inside the real Workers runtime against an
        # isolated local D1 (Miniflare), with the committed migrations applied
        # to a fresh database — D1 is not mocked, and no Cloudflare credentials
        # or remote database are involved. Merged into this job rather than
        # standing alone: it is a second `vitest` invocation against a second
        # config, it shares this job's install exactly, and it was never on the
        # critical path (E2E is). One fewer status, one fewer install, no lost
        # coverage — and the step names below still say which suite failed.
        run: pnpm run test:kernel

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Production build
        run: pnpm run build

      - name: Cloudflare deployment config is valid
        # DalyHub is Cloudflare-first, and until now NOTHING in CI checked that
        # the thing it builds can actually be deployed — a broken binding, a
        # malformed `wrangler.jsonc` or a compatibility-date mistake only
        # surfaced at deploy time, on production. `--dry-run` resolves the
        # config, bundles the Worker and prints the bindings it would attach,
        # then exits without contacting Cloudflare. It needs NO credentials and
        # NO account access, which is why it is safe on a `contents: read`
        # workflow and on pull requests from anywhere.
        #
        # A step of the build job rather than a path-conditional job of its own:
        # it costs ~20 seconds against a build that already exists here, so
        # gating it behind a path filter would add a rule to maintain and a
        # status to read in exchange for nothing.
        run: pnpm exec wrangler deploy --dry-run --config build/server/wrangler.json

      - name: Strip any local env file from the build output
        # Defence in depth: a fresh CI checkout never has `.dev.vars`, so the
        # build should not produce `build/server/.dev.vars`. Remove it anyway
        # before it becomes a shared artifact, so a local-only dev auth override
        # can never travel into the E2E jobs' production-mode preview server.
        run: rm -f build/server/.dev.vars

      - name: Upload production build artifact
        # `.wrangler/deploy/config.json` is a tiny, deterministic pointer file
        # (a relative path to build/server/wrangler.json — no secrets, no
        # absolute paths, no timestamps) that the Cloudflare Vite plugin writes
        # as a build side effect and needs again at `vite preview` time. It has
        # to travel with build/, or the E2E production-mode server cannot start.
        # include-hidden-files is required: upload-artifact excludes dot-paths by
        # default, which would silently drop the whole .wrangler/ directory.
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            build/
            .wrangler/deploy/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  e2e:
    # `strategy.job-total` is the size of the matrix below, so the shard COUNT
    # has exactly one source of truth — the `shard:` list. Adding or removing an
    # entry rebalances the suite with no other edit and no chance of a
    # `--shard=n/N` that disagrees with the matrix.
    name: E2E ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Backstop for the whole job (install, browser, artifact download, servers,
    # teardown) around a run that Playwright's own `globalTimeout` already bounds
    # at 25 minutes. It must stay comfortably ABOVE that ceiling plus worst-case
    # setup, or GitHub cancels first and a cancelled job uploads nothing — which
    # is the one case where the evidence matters most. Worst observed setup is
    # ~9.5 minutes (the `--with-deps` apt step stalling on a slow Ubuntu
    # mirror), so 40 = 25 + ~10 + margin.
    timeout-minutes: 40
    strategy:
      # Never cancel sibling shards on a failure: every shard's result is
      # reported, so one red shard does not hide the state of the others.
      fail-fast: false
      matrix:
        # EIGHT shards, down from eighteen. The four previous re-splits (3 → 5 →
        # 7 → 10 → 14 → 18) each responded to a shard hitting the ceiling by
        # slicing finer, and each was locally correct. What none of them checked
        # was whether the extra slices were still buying parallelism.
        #
        # They were not. MEASURED on run 31445526789 (`main` @ e1e8bab): shards
        # 5, 9, 10, 12, 16 and 17 sat QUEUED for 5.5–7.0 minutes waiting for a
        # runner, and shard 17 began 5m30s after shard 1. Past roughly twelve
        # concurrent jobs the pool is saturated, so shards 13–18 contributed
        # nothing to wall-clock and cost a full setup each (~1.5–2 min of
        # checkout, install, artifact download and browser install). That is
        # ~30 minutes of the ~150-minute compute bill spent on overhead.
        #
        # The same run measured the suite itself: the twelve shards that
        # completed spent 73.4 minutes of test time, mean 6.1, worst 9.5 — so the
        # whole suite is close to 110 minutes single-worker. Over eight slices
        # that is a 13.8-minute mean against Playwright's re-derived 25-minute
        # ceiling (see playwright.config.ts), which is the same ~55–70% of the
        # ceiling this split has always been tuned to, and eight shards all start
        # in one wave.
        #
        # `workers` stays 1, and this is NOT the knob to turn. It was checked
        # rather than assumed: `e2e/owner-timezone.spec.ts` sets the OWNER's
        # timezone — genuinely global, persisted state — for the duration of its
        # journey, and `e2e/appearance.spec.ts` resets the stored appearance
        # before each of its tests. Either one running concurrently with any
        # date-sensitive or themed test would corrupt it. Raising `workers` would
        # trade a budget problem for a correctness one until those two specs stop
        # mutating owner-level state, which is a test-design change, not a CI one.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Download production build artifact
        # Restores both build/ and .wrangler/deploy/ (see the build job's upload
        # step) at their original repo-root-relative paths.
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .

      - name: Install Playwright browser
        # The FULL Chromium build, not `--only-shell`.
        #
        # #158 installed `chrome-headless-shell` alone, on the sound reasoning
        # that this suite runs headless with no video, headed mode or PDF
        # generation, so the full binary and ffmpeg were unused weight. What that
        # reasoning could not know is that the shell is a DIFFERENT binary, and
        # HARDEN-01 caught it crashing: run 31479232198's shard 4 died with
        #
        #   [pid=11376][err] Received signal 11 SEGV_MAPERR 0000000001b0
        #   ...chrome-headless-shell-linux64/chrome-headless-shell+0x4265412
        #
        # — a SEGFAULT inside `chrome-headless-shell`, followed by every later
        # test failing `browser.newContext: Target page, context or browser has
        # been closed` and 43 never running. That is the DEBT-125 signature, and
        # it is a crash rather than the memory exhaustion everyone had assumed:
        # Chromium's RSS across a full shard is FLAT (measured, −5.5 MB/min).
        #
        # The same suite, at the same commit, on the FULL Chromium build does not
        # crash — that is the browser the diagnosis was run on, over a complete
        # shard 1 and most of a single-process run of all 1492 tests. The binary
        # was the one uncontrolled difference between the two environments, so CI
        # now uses the same one. It costs ~30s of download per shard, which is
        # the price of the crash not being there.
        #
        # If the crash recurs on the full build, this is not the cause and the
        # change should be reverted with that recorded — see DEBT-125.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        id: e2e
        # This shard's slice of the functional journeys, auth fail-closed
        # checks, axe WCAG 2.2 AA scans, dark mode, mobile/touch-target and
        # responsive-overflow coverage, keyboard/Drawer/history behaviour and
        # real local D1 journeys. The union of all shards runs the whole suite
        # exactly once. Safe to split at test granularity because every test
        # creates and tears down its own fixtures rather than depending on a
        # predecessor's state.
        #
        # PLAYWRIGHT_SKIP_BUILD reuses the build/ artifact downloaded above
        # instead of letting the production-mode webServer rebuild it per shard.
        env:
          PLAYWRIGHT_SKIP_BUILD: "1"
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Both uploads are conditioned on the RUN STEP's own outcome, not on
      # `failure()`. `failure()` is false when a job is cancelled — which is what
      # a `timeout-minutes` overrun produces — so a `failure()` condition skips
      # the uploads in the one case where the evidence is most needed.
      # `always()` plus an explicit `outcome != 'success'` uploads on a failed,
      # timed-out or cancelled shard and stays skipped on a green one, so a
      # successful run produces no artifacts at all.
      - name: Upload Playwright report (shard ${{ matrix.shard }})
        if: always() && steps.e2e.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces & failure screenshots (shard ${{ matrix.shard }})
        if: always() && steps.e2e.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The one required status.
  # ---------------------------------------------------------------------------
  gate:
    name: CI Gate
    needs: [changes, static, test, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every required job succeeded
        # `needs.<job>.result` collapses a whole matrix to one value, and it is
        # never "success" unless EVERY shard succeeded — a cancelled shard
        # reports "cancelled", a failed one "failure", one that never ran
        # "skipped".
        #
        # "skipped" is accepted here, and only here, because the `changes` job
        # above can legitimately skip `test`, `build` and `e2e` for a
        # documentation-only pull request. That is the single intended path to a
        # skip; `static` and `changes` themselves have no `if:` and so can never
        # be skipped, which means a green gate always represents at least a full
        # static pass. Every other non-success result fails the gate.
        run: |
          set -euo pipefail
          echo '${{ toJson(needs) }}' > needs.json
          {
            echo "| Required job | Result |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' needs.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' needs.json)"
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failed. Not successful: $(tr "\n" " " <<<"$bad")"
            exit 1
          fi
          # A skipped `static` would mean the workflow structure changed without
          # this check being revisited; refuse rather than pass vacuously.
          if [ '${{ needs.static.result }}' != 'success' ]; then
            echo "::error::CI Gate failed: Static did not succeed."
            exit 1
          fi
          # Defence in depth: a skip is only ever legitimate when `Scope` asked
          # for one. Accepting "skipped" above is what lets a documentation-only
          # pull request go green, and it is also what would let a BROKEN scope
          # job wave a real change through with nothing but Static run — which
          # is not hypothetical: the first version of this pipeline did exactly
          # that, because a `grep -q` in a pipeline under `pipefail` inverted
          # its answer. The scope decision and the skips it is supposed to cause
          # are cross-checked here, so that failure mode is a red gate rather
          # than a silent one, whatever future edit reintroduces it.
          if [ '${{ needs.changes.outputs.code }}' = 'true' ]; then
            vacuous="$(jq -r 'to_entries[]
              | select(.value.result == "skipped")
              | .key' needs.json)"
            if [ -n "$vacuous" ]; then
              list="$(tr '\n' ' ' <<<"$vacuous")"
              echo "::error::CI Gate failed: Scope says this change is executable, but these jobs were skipped: $list"
              exit 1
            fi
          fi
          echo "All required jobs succeeded (documentation-only skips allowed)."
